[workspace]
resolver = "2"
members = [
    "crates/aegis-crypto",
    "crates/aegis-privacy",
    "crates/aegis-types",
    "crates/aegis-state",
    "crates/aegis-vm",
    "crates/aegis-consensus",
    "crates/aegis-mempool",
    "crates/aegis-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aegis Protocol Core Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aegis-protocol/aegis"

[workspace.dependencies]
# Internal crates
aegis-crypto = { path = "crates/aegis-crypto" }
aegis-privacy = { path = "crates/aegis-privacy" }
aegis-types = { path = "crates/aegis-types" }
aegis-state = { path = "crates/aegis-state" }
aegis-vm = { path = "crates/aegis-vm" }
aegis-consensus = { path = "crates/aegis-consensus" }
aegis-mempool = { path = "crates/aegis-mempool" }
aegis-node = { path = "crates/aegis-node" }

# Cryptography
blake3 = "1.5"
sha3 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
curve25519-dalek = { version = "4.1", features = ["rand_core", "serde"] }
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }

# Serialization & Zero-Copy
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = { version = "0.4", features = ["serde"] }

# Async & Runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# Observability & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
